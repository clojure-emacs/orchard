version: 2.1

# Default settings for executors

orbs:
  win: circleci/windows@5.0.0

defaults: &defaults
  working_directory: ~/repo
  environment:
    # The Clojure CLI honors JAVA_OPTS, not JVM_OPTS (a Leiningen convention),
    # so the earlier JVM_OPTS was silently ignored. Without a heap cap JDK 11,
    # which lacks the cgroup memory-limit detection JDK 17+ have, sizes its
    # heap off the host's RAM and gets OOM-killed inside the container.
    JAVA_OPTS: -Xmx2500m -Dclojure.main.report=stderr

# Runners for each major OpenJDK

executors:
  jdk8:
    docker:
      - image: clojure:temurin-8-noble
    <<: *defaults
  jdk11:
    docker:
      - image: clojure:temurin-11-noble
    <<: *defaults
  jdk17:
    docker:
      - image: clojure:temurin-17-noble
    <<: *defaults
  jdk21:
    docker:
      - image: clojure:temurin-21-noble
    <<: *defaults
  jdk25:
    docker:
      - image: clojure:temurin-25-noble
    <<: *defaults
  jdk26:
    docker:
      - image: clojure:temurin-26-noble
    <<: *defaults

# Runs a given set of steps, with some standard pre- and post-
# steps, including restoring of cache, saving of cache.
#
# Adapted from https://github.com/lambdaisland/meta/blob/master/circleci/clojure_orb.yml

commands:
  with_cache:
    description: |
      Run a set of steps with Maven dependencies and Clojure classpath cache
      files cached.
      This command restores ~/.m2, .cpcache and such if they were previously cached,
      then runs the provided steps, and finally saves the cache.
      The cache-key is generated based on the contents of `deps.edn` present in
      the `working_directory`.
    parameters:
      steps:
        type: steps
      files:
        description: Files to consider when creating the cache key
        type: string
        default: "deps.edn build/main.clj"
      cache_version:
        type: string
        description: "Key used to identify unique cache"
        default: "1"
    steps:
      - run:
          name: Generate Cache Checksum
          command: |
            for file in << parameters.files >>
            do
              find . -name $file -exec cat {} +
            done | sha256sum | awk '{print $1}' > /tmp/clojure_cache_seed
      - restore_cache:
          key: cache2-<< parameters.cache_version >>-{{ checksum "/tmp/clojure_cache_seed" }}
      - steps: << parameters.steps >>
      - save_cache:
          paths:
            - ~/.m2
            - ~/.gitlibs
            - .cpcache
            - base-jdk-src.zip
          key: cache2-<< parameters.cache_version >>-{{ checksum "/tmp/clojure_cache_seed" }}

  prepare_deps:
    description: |
      Resolve the dependencies for the build tooling and the given alias
      groups up front, retrying on failure. Computing a classpath occasionally
      dies with a ClassCastException from HashMap internals: Maven's model
      validator caches the coordinates it has validated in an unsynchronized
      HashSet, and tools.deps resolves on several threads at once. It strikes
      whenever .cpcache misses, and a retry is all it takes.
    parameters:
      aliases:
        description: |
          Space-separated alias groups to prepare, e.g. ":1.12:dev:test :kondo"
        type: string
    steps:
      - run:
          name: Preparing dependencies
          command: |
            prepare() {
              clojure -P -T:build || return 1
              for aliases in << parameters.aliases >>; do
                clojure -P -M"$aliases" || return 1
              done
            }
            attempt=1
            until prepare; do
              if [ "$attempt" -ge 3 ]; then
                echo "Giving up after $attempt attempts."
                exit 1
              fi
              attempt=$((attempt + 1))
              echo "Resolving dependencies failed, retrying..."
              sleep 5
            done

  setup-windows:
    steps:
      - checkout
      - run:
          name: Install Clojure CLI
          command: |
            Invoke-WebRequest -Uri https://github.com/clojure/brew-install/releases/latest/download/win-install.ps1 -OutFile win-install.ps1
            powershell -File win-install.ps1

jobs:

  lint:
    parameters:
      clojure_version:
        type: string
        default: "1.12"
    executor: jdk26
    environment:
      CLOJURE_VERSION: << parameters.clojure_version >>
    steps:
      - checkout
      - with_cache:
          cache_version: "lint_v3_<< parameters.clojure_version >>"
          steps:
            - prepare_deps:
                aliases: ":cljfmt :kondo :eastwood"
            - run:
                name: Running cljfmt
                command: make cljfmt
            - run:
                name: Running clj-kondo
                command: make kondo
            - run:
                name: Running Eastwood
                command: make eastwood

  deploy:
    executor: jdk8
    steps:
      - checkout
      - run:
         name: Deploy
         command: make deploy

  test:
    description: |
      Run tests against given version of JDK and Clojure
    parameters:
      command:
        description: Command to pass to Make
        type: string
        default: test
      jdk_version:
        description: Version of JDK to test against
        type: string
      clojure_version:
        description: Version of Clojure to test against
        type: string
      extra_aliases:
        description: Extra aliases the command's tests need, e.g. ":+cljs"
        type: string
        default: ""
    executor: << parameters.jdk_version >>
    environment:
      CLOJURE_VERSION: << parameters.clojure_version >>
    steps:
      - checkout
      - with_cache:
          cache_version: "test_v3_<< parameters.clojure_version >>_<< parameters.jdk_version >>_<< parameters.command >>"
          steps:
            - prepare_deps:
                aliases: ":<< parameters.clojure_version >>:dev:test<< parameters.extra_aliases >>"
            - run:
                name: Running tests (make << parameters.command >>)
                command: make << parameters.command >>

  test-windows:
    description: |
      Run tests on MS-Windows using the system's JDK version and Clojure 1.12.
    executor: win/default
    steps:
      - setup-windows
      - run:
          name: Running tests on Windows
          command: |
            java -version; if(-not $?){exit 9}
            clojure -T:build javac :with-tests true; if(-not $?){exit 9}
            clojure -X:1.12:dev:test:+cljs; if(-not $?){exit 9}

# The ci-test-matrix does the following:
#
# - run tests against the target matrix
# - kondo, eastwood and cljfmt

run_always: &run_always
  filters:
    branches:
      only: /.*/
    tags:
      only: /.*/

workflows:
  version: 2.1
  ci-test-matrix:
    jobs:
      - test:
          matrix:
            # Test latest stable Clojure with all supported JDKs.
            alias: "test-1.12"
            parameters:
              jdk_version: [jdk8, jdk11, jdk17, jdk21, jdk25, jdk26]
              clojure_version: ["1.12"]
          <<: *run_always
      - test:
          matrix:
            # Test future Clojure with all JDKs it supports (17+).
            alias: "test-1.13"
            parameters:
              jdk_version: [jdk17, jdk21, jdk25, jdk26]
              clojure_version: ["1.13"]
          <<: *run_always
      - test:
          matrix:
            # Test older Clojure versions against min and max supported JDK version.
            alias: "test-older"
            parameters:
              jdk_version: [jdk8, jdk26]
              clojure_version: ["1.10", "1.11"]
          <<: *run_always
      - test:
          matrix:
            alias: "test-with-cljs"
            parameters:
              jdk_version: [jdk26]
              clojure_version: ["1.12"]
              command: ["test-with-cljs"]
              extra_aliases: [":+cljs"]
          <<: *run_always
      - test-windows:
          <<: *run_always
      - lint:
          <<: *run_always
      - deploy:
          requires:
            - test-1.12
            - test-1.13
            - test-older
            - test-with-cljs
            - test-windows
            - lint
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+(-alpha\d+)?$/
